<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">API2MCP 系统架构</title><desc id="desc">管理后台维护文档与凭证，Go 服务保存到加密 SQLite；AI 客户端使用独立 MCP Token 调用选中的 API，经代理转发到上游业务服务。</desc><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{font-weight:700;letter-spacing:-1px}.muted{fill:#71829c}.small{font-size:16px}</style><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 7 4 0 8" fill="none" stroke="#4576dc" stroke-width="1.7"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 7 4 0 8" fill="none" stroke="#269b79" stroke-width="1.7"/></marker></defs>
<rect width="1280" height="720" rx="18" fill="#f5f8fd"/><text x="46" y="55" font-size="28" class="title" fill="#142849">一套后台，多个 MCP 服务</text><text x="46" y="85" font-size="17" class="muted">管理配置与工具调用分开认证，文档和凭证在 Go 服务内汇合。</text>
<rect x="370" y="120" width="555" height="510" rx="18" fill="white" stroke="#cddbee" stroke-width="2"/><path d="M370 178h555" stroke="#e4ebf6"/><text x="396" y="157" font-size="22" font-weight="700" fill="#234774">API2MCP · Go 服务</text><text x="758" y="155" font-size="14" class="muted">单进程 / Docker</text>
<rect x="45" y="190" width="245" height="170" rx="14" fill="#edf3ff" stroke="#c9d9fc"/><text x="67" y="226" font-size="22" font-weight="650" fill="#294f97">管理后台</text><text x="67" y="260" font-size="17" fill="#4d668f">文档列表与详情 / API 调试</text><text x="67" y="291" font-size="17" fill="#4d668f">服务配置 / JSON 复制</text><text x="67" y="330" font-size="14" fill="#315fb3">管理员 Token → Cookie 会话</text>
<rect x="400" y="202" width="495" height="150" rx="12" fill="#f4f7ff" stroke="#dbe5fb"/><text x="424" y="236" font-size="19" font-weight="650" fill="#345991">管理 API</text><text x="424" y="271" font-size="17" fill="#657c9f">OpenAPI 解析 → API 选择 → 草稿 / 发布</text><text x="424" y="307" font-size="16" fill="#657c9f">基础地址 · Header / Query / Body / Cookie 凭证</text><path d="M293 275h68" stroke="#4576dc" stroke-width="2" marker-end="url(#blue)"/>
<rect x="998" y="190" width="237" height="170" rx="14" fill="#f3efff" stroke="#d9cff7"/><text x="1020" y="226" font-size="22" font-weight="650" fill="#7053a8">加密 SQLite</text><text x="1020" y="264" font-size="17" fill="#827299">文档 / 服务 / 凭证 / 日志</text><text x="1020" y="297" font-size="17" fill="#827299">AES-256-GCM · 数据卷</text><text x="1020" y="330" font-size="14" fill="#827299">备份数据库 + 原加密密钥</text><path d="M930 275h58" stroke="#4576dc" stroke-width="2" marker-end="url(#blue)"/>
<path d="M647 357v39" stroke="#9db1d1" stroke-width="2" stroke-dasharray="5 5"/><text x="667" y="384" font-size="14" class="muted">读取已发布配置</text>
<rect x="45" y="426" width="245" height="170" rx="14" fill="#eaf8f3" stroke="#c2e7da"/><text x="67" y="462" font-size="22" font-weight="650" fill="#267b60">AI / MCP 客户端</text><text x="67" y="500" font-size="17" fill="#608779">Streamable HTTP</text><text x="67" y="532" font-size="17" fill="#608779">tools/list · tools/call</text><text x="67" y="568" font-size="14" fill="#267b60">每个 MCP 服务独立调用 Token</text>
<rect x="400" y="407" width="495" height="189" rx="12" fill="#effaf6" stroke="#cee9dd"/><text x="424" y="443" font-size="19" font-weight="650" fill="#2b7a5b">/mcp/{slug}</text><text x="424" y="480" font-size="17" fill="#608779">服务 Token → 所选工具 → Schema 校验</text><text x="424" y="514" font-size="17" fill="#608779">客户端 Header 优先 → 文档凭证 → 工具参数</text><rect x="423" y="540" width="443" height="35" rx="7" fill="#dff2e9"/><text x="440" y="563" font-size="15" fill="#387e65">HTTP 代理 · 参数序列化 · 超时与响应处理</text><path d="M293 509h68" stroke="#269b79" stroke-width="2" marker-end="url(#green)"/>
<rect x="998" y="426" width="237" height="170" rx="14" fill="#fff8ed" stroke="#eedec2"/><text x="1020" y="462" font-size="22" font-weight="650" fill="#9c7432">已有业务 API</text><text x="1020" y="500" font-size="17" fill="#9b896a">HTTP / HTTPS</text><text x="1020" y="532" font-size="17" fill="#9b896a">公网 / 局域网 / Mock</text><text x="1020" y="568" font-size="14" fill="#9b896a">保留现有业务实现</text><path d="M930 509h58" stroke="#269b79" stroke-width="2" marker-end="url(#green)"/>
<circle cx="50" cy="675" r="5" fill="#4576dc"/><text x="66" y="681" font-size="15" class="muted">管理链路</text><circle cx="197" cy="675" r="5" fill="#269b79"/><text x="213" y="681" font-size="15" class="muted">工具调用链路</text><text x="790" y="681" font-size="15" class="muted">一个服务可组合多份文档，同一 API 可用于多个服务。</text></svg>