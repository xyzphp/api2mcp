<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">GitHub Actions 验证与发布流程</title><desc id="desc">每次提交和 Pull Request 自动检查代码并验证容器；发布 Release 时验证版本、构建 amd64 和 arm64 镜像并推送 GHCR。</desc><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.title{font-weight:700;letter-spacing:-1px}.muted{fill:#71829c}.small{font-size:16px}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 7 4 0 8" fill="none" stroke="#8fa8cf" stroke-width="1.8"/></marker></defs><rect width="1280" height="420" rx="18" fill="#f5f8fd"/><text x="40" y="52" class="title" font-size="27" fill="#142849">验证每次提交，在 Release 发布镜像</text><text x="40" y="84" font-size="16" class="muted">GitHub Actions · 固定 Action SHA · GITHUB_TOKEN · BuildKit 缓存</text>
